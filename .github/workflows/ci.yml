name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configure npm for flaky networks
        run: |
          npm config set fetch-retries 8
          npm config set fetch-retry-factor 10
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 20000

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          success=0
          attempts=0
          until [ $attempts -ge 3 ]
          do
            attempts=$((attempts+1))
            echo "npm ci attempt $attempts"
            if npm ci; then
              success=1
              break
            fi
            echo "npm ci failed; running npm cache verify/clean before retry (attempts=$attempts)..."
            npm cache verify || true
            npm cache clean --force || true
            sleep $((attempts * 5))
          done
          if [ $success -ne 1 ]; then
            echo "npm ci failed after $attempts attempts"
            # leave non-zero exit but because continue-on-error=true the workflow will continue
            exit 1
          fi

      - name: Diagnose walker tarball (runs when install failed)
        if: steps.install.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "=== package-lock.json snippet for 'walker' ==="
          node -e "
          const fs=require('fs');
          const pl=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          function find(name, node) {
            if (!node) return null;
            if (node.name===name) return node;
            if (node.dependencies) {
              if (node.dependencies[name]) return node.dependencies[name];
              for (const k of Object.keys(node.dependencies)) {
                const found = find(name, node.dependencies[k]);
                if (found) return found;
              }
            }
            return null;
          }
          // check top-level dependencies object (v2 lockfile) and packages object (v3)
          const byDeps = pl.dependencies && find('walker', {dependencies: pl.dependencies});
          const byPackages = pl.packages && (Object.entries(pl.packages).map(([p,v])=>({path:p,...v})).find(x=>x.name==='walker'));
          const info = byDeps || byPackages || null;
          if(!info){ console.log('walker not found in package-lock.json'); process.exit(0); }
          console.log(JSON.stringify(info, null, 2));
          " || true

          # Extract resolved + integrity using node for robust parsing
          resolved=$(node -e "const fs=require('fs');const pl=JSON.parse(fs.readFileSync('package-lock.json','utf8')); function get(n,obj){ if(!obj) return ''; if(obj.dependencies && obj.dependencies[n]) return obj.dependencies[n].resolved||''; if(obj.packages){ for(const p in obj.packages){ if(obj.packages[p].name===n) return obj.packages[p].resolved||'' } } return ''; } console.log(get('walker', pl));")
          expected=$(node -e "const fs=require('fs');const pl=JSON.parse(fs.readFileSync('package-lock.json','utf8')); function get(n,obj){ if(!obj) return ''; if(obj.dependencies && obj.dependencies[n]) return obj.dependencies[n].integrity||''; if(obj.packages){ for(const p in obj.packages){ if(obj.packages[p].name===n) return obj.packages[p].integrity||'' } } return ''; } console.log(get('walker', pl));")
          echo "resolved=$resolved"
          echo "expected integrity=$expected"

          if [ -z "$resolved" ]; then
            echo "No resolved URL found for walker; skipping download check."
            exit 0
          fi

          echo "Downloading tarball from resolved URL..."
          curl -sL "$resolved" -o /tmp/walker.tgz || (echo "curl failed"; exit 0)

          echo "Computing sha512 of downloaded tarball..."
          actual_base64=$(openssl dgst -sha512 -binary /tmp/walker.tgz | openssl base64 -A)
          actual="sha512-$actual_base64"
          echo "actual integrity=$actual"

          if [ "$expected" = "$actual" ]; then
            echo "Integrity matches (unexpected)"
          else
            echo "Integrity mismatch confirmed: expected != actual"
          fi

      - name: Upload npm debug logs
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/*.log
          if-no-files-found: ignore

      - name: Fail if install failed
        if: steps.install.outcome == 'failure'
        run: |
          echo "Install step failed previously; failing job after diagnostic"
          exit 1

      - name: Build and start services (Docker Compose)
        run: |
          docker compose down -v
          docker compose up --build -d

      - name: Wait for API health
        run: |
          echo "Waiting for API to become healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run linter
        run: npm run lint

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Tear down services
        if: always()
        run: |
          if [ -f .env ]; then
            echo "Found .env — bringing docker compose down"
            docker compose down -v || true
          else
            echo ".env not found — skipping docker compose down"
          fi
