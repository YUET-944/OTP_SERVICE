name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (retry on transient failures)
        run: |
          attempts=0
          until [ $attempts -ge 3 ]
          do
            attempts=$((attempts+1))
            echo "npm ci attempt $attempts"
            npm cache clean --force || true
            npm ci && break
            echo "npm ci failed; running npm cache verify and retrying (attempts=$attempts)..."
            npm cache verify || true
            sleep $((attempts * 5))
          done
          if [ $attempts -ge 3 ]; then
            echo "npm ci failed after $attempts attempts"
            exit 1
          fi

      - name: Build and start services (Docker Compose)
        run: |
          docker compose down -v
          docker compose up --build -d

      - name: Wait for API health
        run: |
          echo "Waiting for API to become healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run linter
        run: npm run lint

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Tear down services
        if: always()
        run: |
          if [ -f .env ]; then
            echo "Found .env — bringing docker compose down"
            docker compose down -v || true
          else
            echo ".env not found — skipping docker compose down"
          fi
