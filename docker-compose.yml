version: '3.9'

services:
  app:
    build: .
    container_name: otp_service_app
    command: sh -c "npm install && npm run dev:api"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DELIVERY_MODE: mock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - otp_network

  redis:
    image: redis:7-alpine
    container_name: otp_service_redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otp_network

  postgres:
    image: postgres:15-alpine
    container_name: otp_service_postgres
    environment:
      POSTGRES_DB: ${PG_DATABASE:-otp_service}
      POSTGRES_USER: ${PG_USER:-dev}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dev}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-dev}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - otp_network

networks:
  otp_network:
    driver: bridge

volumes:
  postgres_data:
